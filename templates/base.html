<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Messaging Center{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/tokens.css?v={{ build_id }}">
    <link rel="stylesheet" href="/static/css/base.css?v={{ build_id }}">
    {% block styles %}{% endblock %}
</head>
<body class="{% block body_class %}app-shell{% endblock %}"
      data-build-id="{{ build_id }}"
      data-app-version="{{ app_version }}"
      data-system-phone="{{ sms_did | default('+19296141937') }}"
      data-user-role="{{ user.role if user else '' }}"
      data-user-name="{{ user.display_name if user else '' }}"
      data-csrf-token="{{ csrf_token | default('') }}"
      data-idle-timeout-sec="{{ idle_timeout_seconds | default(0) }}"
      data-session-expires-at="{{ session_expires_at | default('') }}">

    {% block content %}{% endblock %}

    {% block scripts %}{% endblock %}
</body>
</html>
