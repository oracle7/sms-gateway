<aside class="sidebar">
    <div class="sidebar-top">
        <div class="sidebar-title-row">
            <h2 class="sidebar-title">Conversations</h2>
            <button id="new-chat-btn" type="button" class="btn btn-primary btn-sm">+ New</button>
        </div>
        <input id="thread-search" type="search" class="search-input" placeholder="Search name, phone, or message..." autocomplete="off">
        <div class="sidebar-tabs" role="tablist">
            <button id="tab-inbox" type="button" class="tab-btn active" role="tab" aria-selected="true">Inbox</button>
            <button id="tab-archived" type="button" class="tab-btn" role="tab" aria-selected="false">Archived</button>
        </div>
    </div>

    <div id="thread-list" class="thread-list">
        <div class="chat-empty-state" style="padding: 24px;">Loading conversations...</div>
    </div>

    <div id="threads-load-more-wrap" class="sidebar-footer hidden">
        <button id="threads-load-more-btn" type="button" class="btn btn-secondary btn-sm" style="width: 100%;">
            Load more conversations
        </button>
    </div>
</aside>
