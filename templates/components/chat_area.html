<main class="chat-pane">
    <div id="chat-header" class="chat-header hidden">
        <div class="chat-header-info">
            <h3 id="chat-contact-name" class="chat-contact-name">Select a conversation</h3>
            <div id="chat-contact-phone" class="chat-contact-phone"></div>
        </div>
        <div class="chat-header-actions">
            {% if user and user.role == 'admin' %}
            <label class="toggle-label">
                <input id="show-hidden-toggle" type="checkbox">
                Show hidden
            </label>
            {% endif %}
            <button id="archive-thread-btn" type="button" class="btn btn-secondary btn-sm">Archive</button>
        </div>
    </div>

    <div id="chat-area" class="chat-messages">
        <div class="chat-empty-state">Select a conversation on the left, or click <strong>+ New</strong> to start one.</div>
    </div>

    <div class="composer-wrap">
        <div id="composer-error" class="composer-error hidden" role="alert"></div>
        <div id="emoji-picker-panel" class="emoji-picker-panel hidden" role="dialog" aria-label="Emoji picker"></div>

        <form id="message-form" class="composer-form">
            <button id="emoji-toggle-btn" type="button" class="emoji-toggle-btn" title="Add emoji" aria-label="Add emoji">
                😊
            </button>
            <textarea id="message-input"
                      rows="1"
                      class="composer-input"
                      placeholder="Type an SMS... (Enter to send, Shift + Enter for new line)"
                      autocomplete="off"></textarea>
            <button id="send-btn" type="submit" class="btn btn-primary send-btn">Send</button>
        </form>
    </div>
</main>
