<main class="flex-1 flex flex-col h-full overflow-hidden bg-gray-50">
    <!-- Active Contact Header -->
    <div class="p-4 border-b bg-white shrink-0 flex items-center shadow-sm z-10">
        <h3 id="current-contact-name" class="text-lg font-semibold text-gray-800">Select a conversation</h3>
    </div>

    <!-- Message Bubbles Container -->
    <div id="chat-area" class="flex-1 overflow-y-auto p-4 flex flex-col space-y-2">
        <div class="flex h-full items-center justify-center text-gray-400">
            Messages will appear here...
        </div>
    </div>

    <!-- Message Input Form -->
    <div class="p-4 bg-white border-t shrink-0">
        <form id="message-form" class="flex space-x-2">
            <input type="text"
                   id="message-input"
                   class="flex-1 border rounded-full px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-100"
                   placeholder="Type an SMS..."
                   autocomplete="off">
            <button type="submit"
                    class="bg-blue-500 text-white rounded-full px-6 py-2 font-medium hover:bg-blue-600 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                Send
            </button>
        </form>
    </div>
</main>
