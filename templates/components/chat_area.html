<main class="flex-1 flex flex-col h-full overflow-hidden bg-gray-50 relative">
    <!-- Message Bubbles Container -->
    <div id="chat-area" class="flex-1 overflow-y-auto p-4 flex flex-col space-y-3">
        <div class="flex h-full items-center justify-center text-gray-400">
            Messages will appear here...
        </div>
    </div>

    <!-- Message Input Form -->
    <div class="p-4 bg-white border-t border-gray-200 shrink-0 z-10">
        <form id="message-form" class="flex space-x-2">
            <input type="text"
                   id="message-input"
                   class="flex-1 border border-gray-300 rounded-full px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"
                   placeholder="Type an SMS..."
                   autocomplete="off">
            <button type="submit"
                    class="bg-blue-600 text-white rounded-full px-6 py-2 font-medium hover:bg-blue-700 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                Send
            </button>
        </form>
    </div>
</main>
