<aside class="w-[380px] bg-white border-l border-gray-200 flex flex-col h-full overflow-hidden shrink-0 z-10">
    <div class="p-4 border-b border-gray-200 bg-gray-50 flex items-center justify-center shrink-0">
        <h2 class="text-lg font-semibold text-gray-700">Details</h2>
    </div>

    <!-- Dynamic Contact Info -->
    <div class="p-6 flex flex-col items-center border-b border-gray-100 shrink-0">
        <div class="w-20 h-20 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-3xl font-bold mb-4">
            <span id="contact-initial">?</span>
        </div>
        <h3 id="right-contact-name" class="text-xl font-bold text-gray-800 text-center">Select a conversation</h3>
        <p id="right-contact-phone" class="text-sm text-gray-500 mt-1"></p>
    </div>

    <!-- Emoji Picker Container (Hidden by default until a chat opens) -->
    <div id="sidebar-emoji-container" class="hidden flex-1 p-2 overflow-hidden flex justify-center bg-gray-50">
        <emoji-picker id="emoji-picker" class="light" style="width: 100%; height: 100%; --background: transparent; --border-color: transparent;"></emoji-picker>
    </div>
</aside>
