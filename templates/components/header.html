<header class="top-header">
    <div class="header-left">
        <a href="/" class="brand-link">Messaging Center</a>
        <nav class="main-nav" aria-label="Main navigation">
            <a href="/" class="nav-link {% if active_page == 'messages' %}active{% endif %}">Messages</a>
            <a href="/contacts" class="nav-link {% if active_page == 'contacts' %}active{% endif %}">Contacts</a>
            {% if user and user.role == 'admin' %}
            <a href="/admin" class="nav-link {% if active_page == 'admin' %}active{% endif %}">Admin</a>
            {% endif %}
        </nav>
    </div>

    <div class="header-right">
        <button id="sound-toggle-btn" type="button" class="btn-icon-toggle" title="Toggle new message chime">
            Sound: On
        </button>
        <button id="notify-toggle-btn" type="button" class="btn-icon-toggle" title="Toggle Firefox desktop notifications (no patient details shown)">
            Alerts: Off
        </button>

        <div class="device-badge" title="Pixel 6 Android Gateway Status">
            <span id="device-health-led" class="health-led" title="Waiting for ping..."></span>
            <span>Pixel 6</span>
            <span class="divider-pipe">|</span>
            <span id="battery-charging" class="charging-bolt hidden" title="Charging">⚡</span>
            <span id="battery-level" class="battery-text">--%</span>
        </div>

        <span class="user-pill">{{ user.display_name }}</span>
        <button id="change-password-open-btn" type="button" class="btn btn-secondary btn-sm">Password</button>
        <button id="logout-btn" type="button" class="btn btn-secondary btn-sm">Sign Out</button>
    </div>
</header>

<div id="version-banner" class="version-banner hidden" role="status">
    <span id="version-banner-text">A new version is available. It will reload automatically after you send or clear your message.</span>
    <button id="version-reload-btn" type="button" class="btn btn-secondary btn-sm">Reload Now</button>
</div>
