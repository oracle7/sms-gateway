<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Contacts - SMS Gateway</title>
</head>
<body class="bg-gray-100 h-screen flex flex-col overflow-hidden relative">
    
    <div id="header-placeholder"></div>

    <div class="flex-1 overflow-y-auto p-8">
        <div class="max-w-4xl mx-auto">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold text-gray-800">Directory</h1>
                <button onclick="openAddContactModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md font-medium transition shadow-sm">
                    + Add Contact
                </button>
            </div>
            
            <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                <div class="p-4 border-b border-gray-200 bg-gray-50">
                    <input type="text" id="contactSearchInput" onkeyup="filterContacts()" placeholder="Search contacts..." class="w-full border border-gray-300 rounded p-2 text-sm focus:outline-blue-500">
                </div>
                
                <div class="divide-y divide-gray-200" id="contactList">
                    <div class="p-4 text-center text-gray-500 py-10">
                        Loading contacts...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="addContactModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center">
        <div class="bg-white p-6 rounded-lg shadow-xl max-w-sm w-full">
            <h2 class="text-xl font-bold mb-2 text-gray-800">Add New Contact</h2>
            <p class="text-sm text-gray-600 mb-4">Save a name and number to the gateway directory.</p>
            
            <div class="space-y-3 mb-6">
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Full Name</label>
                    <input type="text" id="contactName" class="w-full border border-gray-300 rounded p-2 focus:outline-blue-500 text-sm" placeholder="John Doe">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Phone Number</label>
                    <input type="text" id="contactPhone" class="w-full border border-gray-300 rounded p-2 focus:outline-blue-500 text-sm" placeholder="10+ digit number (digits only)">
                </div>
            </div>

            <div class="flex justify-end gap-2">
                <button onclick="closeAddContactModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded text-sm">Cancel</button>
                <button onclick="submitContact()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded font-medium text-sm">Save Contact</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;
        let allContacts = [];

        async function loadHeader() {
            try {
                const res = await fetch('/ui/header.html');
                if (!res.ok) throw new Error('Header not found');
                document.getElementById('header-placeholder').innerHTML = await res.text();
                
                const currentPage = window.location.pathname.split('/').pop() || 'contacts.html';
                document.querySelectorAll('.nav-link').forEach(link => {
                    if (link.getAttribute('data-target') === currentPage) {
                        link.classList.remove('text-gray-300');
                        link.classList.add('text-blue-400', 'font-bold');
                    }
                });
            } catch (e) {
                console.error('Failed to load header:', e);
            }
        }

        async function fetchContacts() {
            try {
                const res = await fetch(`${API_URL}/contacts/`);
                allContacts = await res.json();
                renderContactsList(allContacts);
            } catch (e) {
                document.getElementById('contactList').innerHTML = `<div class="p-6 text-center text-red-500">Failed to load contacts.</div>`;
            }
        }

        function renderContactsList(contactsArray) {
            const list = document.getElementById('contactList');
            
            if (contactsArray.length === 0) {
                list.innerHTML = `<div class="p-6 text-center text-gray-400">No contacts found.</div>`;
                return;
            }

            list.innerHTML = contactsArray.map(c => `
                <div class="p-4 hover:bg-gray-50 flex justify-between items-center transition" id="contact-row-${c.phone_number}">
                    <div>
                        <div class="font-semibold text-gray-800">${c.name}</div>
                        <div class="text-sm text-gray-500">${c.phone_number}</div>
                    </div>
                    <div class="flex items-center gap-4">
                        <a href="/ui/messages.html?number=${c.phone_number}" class="text-sm text-blue-600 hover:text-blue-800 font-medium transition">
                            Message
                        </a>
                        <button onclick="deleteContact('${c.phone_number}', '${c.name}')" class="text-sm text-red-500 hover:text-red-700 font-medium transition">
                            Delete
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function filterContacts() {
            const term = document.getElementById('contactSearchInput').value.toLowerCase().trim();
            if (!term) {
                renderContactsList(allContacts);
                return;
            }
            const filtered = allContacts.filter(c => 
                c.name.toLowerCase().includes(term) || c.phone_number.includes(term)
            );
            renderContactsList(filtered);
        }

        function openAddContactModal() {
            document.getElementById('contactName').value = '';
            document.getElementById('contactPhone').value = '';
            document.getElementById('addContactModal').classList.remove('hidden');
            document.getElementById('contactName').focus();
        }

        function closeAddContactModal() {
            document.getElementById('addContactModal').classList.add('hidden');
        }

        async function submitContact() {
            const nameInput = document.getElementById('contactName').value.trim();
            const phoneInput = document.getElementById('contactPhone').value.trim();
            const cleanNumber = phoneInput.replace(/\D/g, '');

            if (!nameInput) {
                alert("Please enter a name.");
                return;
            }
            if (cleanNumber.length < 10) {
                alert("Please enter a valid phone number (at least 10 digits).");
                return;
            }

            try {
                const res = await fetch(`${API_URL}/contacts/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        phone_number: cleanNumber,
                        name: nameInput
                    })
                });

                if (res.ok) {
                    closeAddContactModal();
                    await fetchContacts(); // Refresh the dynamic directory view
                } else {
                    const err = await res.json();
                    alert(`Error creating contact: ${err.detail || 'Server rejected request.'}`);
                }
            } catch (e) {
                alert("Network error. Could not contact API to save phone record.");
            }
        }

        async function deleteContact(phoneNumber, name) {
            if (!confirm(`Are you sure you want to delete ${name} (${phoneNumber})?`)) {
                return;
            }

            try {
                const res = await fetch(`${API_URL}/contacts/${phoneNumber}`, {
                    method: 'DELETE'
                });

                if (res.ok) {
                    const row = document.getElementById(`contact-row-${phoneNumber}`);
                    if (row) row.remove();
                    
                    // Keep local tracking array updated in case user searches immediately
                    allContacts = allContacts.filter(c => c.phone_number !== phoneNumber);
                    
                    if (allContacts.length === 0) {
                        document.getElementById('contactList').innerHTML = `<div class="p-6 text-center text-gray-400">No contacts found.</div>`;
                    }
                } else {
                    const err = await res.json();
                    alert(`Error deleting contact: ${err.detail || 'Server rejected the request.'}`);
                }
            } catch (e) {
                alert("Network error. Could not reach the API to delete the contact.");
            }
        }

        async function init() {
            await loadHeader();
            await fetchContacts();
        }

        init();
    </script>
</body>
</html>
